# ─── Platform credentials & global settings ───────────────────────────────────

discord:
  enabled: false
  token: YOUR_DISCORD_BOT_TOKEN
  embedColor: "#1DA1F2"

telegram:
  enabled: true
  token: YOUR_TELEGRAM_BOT_TOKEN
  parseMode: HTML
  apiRoot: ""

twitter:
  enabled: true # 设为 false 可关闭推文监控, 只跑 AI 聊天 / WebUI
  authToken: ""
  ct0: ""
  username: ""
  password: ""
  email: ""
  totpSecret: ""

webui:
  enabled: true
  port: 3000
  host: "0.0.0.0"
  password: ""

enableApproval: true
sendAsImage: true
xToImageApiUrl: ""
xToImageApiToken: ""
xToImageApiTheme: dark
imageCacheTtlMinutes: 60
pollIntervalMinutes: 5
maxPostsPerFetch: 20
maxTweetAgeMinutes: 60

# ─── Plugins (optional) ───────────────────────────────────────────────────────
# 插件有三种来源（按优先级）：
#   1. 内置 — src/plugins/<name>/  编译到 dist/plugins/<name>/
#   2. GitHub — 自动 clone/pull，缓存在 data/plugins-cache/<name>/
#   3. 外部目录 — pluginsDir 指定的路径
#
plugins:
  - name: ai-chat
    enabled: true
    options:
      # apiUrl: https://api.openai.com/v1
      # apiKey: ""
      # model: gemini-3.5-flash
      # systemPrompt: "你是一只猫娘。"
      # maxTokens: 16384
      # temperature: 0.7
      # allowedGuildIds: []
      # maxToolIterations: 8
      # reactions: true
      # ignoreEveryoneMention: true
      # maxImageBytes: 6291456
      # maxTotalImageBytes: 12582912
      # webSearch:
      #   enabled: true
      #   provider: duckduckgo
      #   apiKey: ""
      #   baseUrl: ""
      #   maxResults: 5
      # memory:
      #   enabled: true
      #   maxProfileItems: 12
      #   maxProfileChars: 800
      #   recentTurns: 6
      #   recallLimit: 8
      #   logConversations: true
      #   maxConversationsPerUser: 500
      # summary:
      #   enabled: true
      #   maxMessagesPerChannel: 500
      #   defaultCount: 100

  - name: log-tweet
    enabled: true
    options:
      logFile: "./data/tweets.log"

  # 从 GitHub 仓库自动拉取
  # - name: translate
  #   github: someuser/translate-plugin
  #   ref: main
  #   enabled: true
  #   options:
  #     targetLang: zh

# 外部插件目录（支持 Docker volume 挂载）
# pluginsDir: /app/data/plugins

# ─── Groups (required) ────────────────────────────────────────────────────────
# Each group has its own users, target channels, and approval settings.

groups:
  - name: my-group
    users:
      - username: elonmusk
        displayName: Elon
        filters:
          keywords:
            include: [tesla, spacex]
          excludeRetweets: true
      - username: RhenCloud_
        displayName: RhenCloud
        filters:
          keywords:
            include: []
            exclude: []
          media:
            requireMedia: false
    discord:
      channelId: "1234567890"
      r14ChannelId: "1234567891"
    telegram:
      chatId: "-1001234567890"
      targets:
        r14:
          chatId: "-100_R14_CHAT_ID"
    approval:
      discordAdminChannelId: "1234567892"
      discordApproveRoleId: "1234567893"
      telegramAdminChatIds:
        - "111111111"

  - name: another-group
    users:
      - username: spacex
        displayName: SpaceX
        filters: {}
    discord:
      channelId: "9876543210"
